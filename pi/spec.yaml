schemaVersion: "1"
kind: agent
name: pi
displayName: Pi
description: "Minimal terminal coding agent with extensible tools, skills, and TUI"

agent:
  image: "docker/sandbox-templates:shell-docker"
  aiFilename: AGENTS.md
  entrypoint:
    run: [pi]

network:
  serviceDomains:
    api.anthropic.com: anthropic
    console.anthropic.com: anthropic
    claude.ai: anthropic
  serviceAuth:
    anthropic:
      headerName: x-api-key
      valueFormat: "%s"
  allowedDomains:
    - registry.npmjs.org

credentials:
  sources:
    anthropic:
      env:
        - ANTHROPIC_API_KEY

environment:
  proxyManaged:
    - ANTHROPIC_API_KEY

commands:
  install:
    - command: |
        npm config set proxy "$HTTP_PROXY"
        npm config set https-proxy "$HTTP_PROXY"
        for i in $(seq 1 5); do
          npm install -g --maxsockets=1 --fetch-timeout=600000 \
            @earendil-works/pi-coding-agent && break
          echo "Retrying ($i/5)..."
        done
      user: "1000"
      description: "Configure npm proxy and install pi coding agent globally (with retries)"
