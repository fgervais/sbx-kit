schemaVersion: "1"
kind: mixin
name: serial-proxy
displayName: Serial Port Proxy
description: >-
  Provides access to a host serial port proxied over TCP via socat.
  On the host, run: socat TCP-LISTEN:8000,reuseaddr,fork FILE:/dev/ttyACM0,b115200,raw,echo=0
  The agent talks to it through the serialcon.py bridge daemon, which keeps
  the single TCP connection alive and logs output to a file.

network:
  allowedDomains:
    - localhost:8000

environment:
  variables:
    SERIAL_HOST: "host.docker.internal"
    SERIAL_PORT: "8000"

memory: |
  ## Serial Console Access

  A host serial port is proxied over TCP via socat. Use the `serial-console` skill
  for full usage instructions.

  Quick start:
  ```bash
  scripts/serialcon.py start
  scripts/serialcon.py send 'your command'
  scripts/serialcon.py tail -n 20
  ```
